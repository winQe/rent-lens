name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentlens
          POSTGRES_PASSWORD: rentlens
          POSTGRES_DB: rentlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it, apps/api/test/concurrency.test.ts is skipped: it needs a real Postgres.
      DATABASE_URL: postgres://rentlens:rentlens@localhost:5432/rentlens
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build

  lambda:
    name: Lambda packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn workspace @rent-lens/api build:lambda
      # The bundles must load on their own, with no node_modules next to them.
      - run: |
          cd build/lambda
          node --input-type=module -e "for (const f of ['fetch', 'load']) { const m = await import('./ingest/' + f + '.mjs'); if (typeof m.handler !== 'function') throw new Error(f + '.mjs has no handler'); }"
          test -x api/run.sh && test -s api/main.mjs && test -s api/rds-ca.pem && test -s ingest/rds-ca.pem

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The brief's one hard rule: the app runs locally. Start it exactly as the README says.
      - name: Start the stack (migrate, roles, load, API, web)
        run: docker compose -p rentlens-ci up -d --build
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:8080/api/v1/meta && exit 0
            sleep 2
          done
          exit 1
      - name: Check the app and the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS 'http://localhost:8080/api/v1/streets?flatType=4-ROOM&budget=3000&pageSize=1' | grep -q '"items"'
          curl -fsS 'http://localhost:8080/api/v1/summary?flatType=4-ROOM' | grep -q '"flatTypes"'
      # Fails on HIGH and CRITICAL vulnerabilities that have a fix.
      - name: Scan the images
        run: |
          for image in rentlens-ci-api rentlens-ci-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - if: failure()
        run: docker compose -p rentlens-ci logs
      - if: always()
        run: docker compose -p rentlens-ci down -v

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans yarn.lock; fails on HIGH and CRITICAL vulnerabilities that have a fix.
      - run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      # Plans and "applies" against a mocked AWS provider, then checks design and security properties.
      - run: terraform -chdir=infra test
      # Configuration scan; accepted findings and their reasons are in infra/.trivyignore.
      - run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 config --severity HIGH,CRITICAL --ignorefile infra/.trivyignore --exit-code 1 infra
