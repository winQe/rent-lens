name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentlens
          POSTGRES_PASSWORD: rentlens
          POSTGRES_DB: rentlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it, apps/api/test/concurrency.test.ts is skipped: it needs a real Postgres.
      DATABASE_URL: postgres://rentlens:rentlens@localhost:5432/rentlens
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      # Plans and "applies" against a mocked AWS provider, then checks design and security properties.
      - run: terraform -chdir=infra test
      # Configuration scan; accepted findings and their reasons are in infra/.trivyignore.
      - run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.1 config --severity HIGH,CRITICAL --ignorefile infra/.trivyignore --exit-code 1 infra
