name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentlens
          POSTGRES_PASSWORD: rentlens
          POSTGRES_DB: rentlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without it, apps/api/test/concurrency.test.ts is skipped: it needs a real Postgres.
      DATABASE_URL: postgres://rentlens:rentlens@localhost:5432/rentlens
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build
