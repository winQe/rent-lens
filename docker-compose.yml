# One command runs everything locally:  docker compose up --build
# then open http://localhost:8080
#
# Ports are bound to 127.0.0.1 only: the database password is a dev default, and the API
# trusts X-Forwarded-For from one proxy hop, which only nginx should provide.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentlens
      POSTGRES_PASSWORD: rentlens
      POSTGRES_DB: rentlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentlens -d rentlens"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: apply migrations, then load the dataset if the database is empty.
  # Downloads from data.gov.sg; an empty database falls back to the bundled snapshot.
  setup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://rentlens:rentlens@db:5432/rentlens
    command: ["sh", "-c", "node dist/migrate.js && node dist/ingest.js --if-empty"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rentlens:rentlens@db:5432/rentlens
      CORS_ORIGINS: http://localhost:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
