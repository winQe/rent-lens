# Local stand-in for CloudFront: serves the built app and forwards /api to the API container.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # The API sets its own security headers (helmet), so these only apply to the static app.
  set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";

  # Resolve the api container through Docker's DNS at request time, not once at startup,
  # so recreating the api container (new IP) does not leave nginx proxying to a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed assets never change, so cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routes such as /streets/... fall back to the app shell.
  location / {
    # Revalidate the app shell on every load, so a redeploy never leaves a stale shell
    # pointing at hashed assets that no longer exist.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}
